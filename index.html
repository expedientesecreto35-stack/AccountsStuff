/* Cuentas P2P: una columna en el celular, barra de mes fija arriba,
   pestañas abajo (lateral en pantallas grandes) y hojas inferiores para registrar operaciones. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --surface2:#E7EDEB; --ink:#12201E; --muted:#566864; --line:#D7E0DD;
  --accent:#0A6B58; --on-accent:#FFFFFF; --accent-tint:#CFE8E0;
  --bs:#8A5A12; --bs-bg:#F6E8CF; --usdt:#0B7A5E; --usdt-bg:#DDF1EA; --usd:#2D56B8; --usd-bg:#E1E9FA;
  --ok:#0B7A5E; --ok-bg:#DDF1EA; --warn:#8F5200; --warn-bg:#FBEBCF; --bad:#B3261E; --bad-bg:#F9DEDB; --idle:#566864; --idle-bg:#E7EDEB;
  --scrim:rgb(8 20 18 / .5); --shadow:0 1px 2px rgb(18 32 30 / .08),0 8px 24px rgb(18 32 30 / .08);
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'Spline Sans Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r-card:14px; --r-btn:11px; --r-in:10px; --r-sheet:18px; --r-md:12px; --r-seg:8px;
  --gap:14px; --cpy:14px; --cpx:16px; --rpy:12px; --rpx:14px; --spy:10px;
  --app-name:"Cuentas P2P";
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1513; --surface:#142120; --surface2:#1D2E2B; --ink:#E4EEEB; --muted:#93A8A3; --line:#26393A;
    --accent:#3FC3A1; --on-accent:#05221B; --accent-tint:#1B4A40;
    --bs:#F0C27A; --bs-bg:#3A2D14; --usdt:#4CCFAA; --usdt-bg:#16342D; --usd:#8FB0FF; --usd-bg:#1B2A4D;
    --ok:#4CCFAA; --ok-bg:#16342D; --warn:#F0B35A; --warn-bg:#3A2B10; --bad:#FF8F85; --bad-bg:#43201D; --idle:#93A8A3; --idle-bg:#1D2E2B;
    --scrim:rgb(0 0 0 / .62); --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#142120; --surface2:#1D2E2B; --ink:#E4EEEB; --muted:#93A8A3; --line:#26393A;
  --accent:#3FC3A1; --on-accent:#05221B; --accent-tint:#1B4A40;
  --bs:#F0C27A; --bs-bg:#3A2D14; --usdt:#4CCFAA; --usdt-bg:#16342D; --usd:#8FB0FF; --usd-bg:#1B2A4D;
  --ok:#4CCFAA; --ok-bg:#16342D; --warn:#F0B35A; --warn-bg:#3A2B10; --bad:#FF8F85; --bad-bg:#43201D; --idle:#93A8A3; --idle-bg:#1D2E2B;
  --scrim:rgb(0 0 0 / .62); --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 24px rgb(0 0 0 / .35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:.9375rem;line-height:1.45;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h2{font-size:1.05rem;font-weight:650;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}

.app{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:0 150px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 8px}
.month{display:flex;align-items:center;gap:4px;flex:none}
.mlabel{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.mlabel strong{font-size:1.15rem;font-weight:650;line-height:1.15;white-space:nowrap}
.link{background:none;border:0;padding:0;color:var(--accent);font-size:.8rem;font-weight:550;text-decoration:underline;text-underline-offset:2px}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon:active{background:var(--surface2)}
.status{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;line-height:1.2;text-align:right}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;flex:none}
.status.saving i{background:var(--warn)}
.status.error i{background:var(--bad)}

.stack{display:flex;flex-direction:column;gap:var(--gap)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--cpy) var(--cpx);min-width:0}
.card>h2{margin-bottom:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

.hero{padding-block:6px 2px}
.hero .lbl{font-size:.8rem;color:var(--muted);font-weight:550;text-transform:uppercase;letter-spacing:.06em}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-block:2px 4px}
.big .num{font-size:clamp(2.3rem,11vw,3.1rem);font-weight:500;line-height:1.05;overflow-wrap:anywhere}
.big .unit{font-family:var(--font-num);font-size:.9rem;color:var(--muted)}
.hero-sub{font-size:.88rem;color:var(--muted)}
.hero-sub b{color:var(--ink);font-weight:500}

.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.stat{padding:var(--rpy) var(--rpx);min-width:0;background:var(--surface)}
.stat:last-child{grid-column:span var(--sp-m,1)}
.stat .sub{display:block;font-size:.72rem;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.stat .lbl{font-size:.74rem;color:var(--muted);font-weight:550}
.stat .num{display:block;font-size:.98rem;font-weight:500;margin-top:2px;overflow-wrap:anywhere}

.notice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid transparent;border-radius:var(--r-md);padding:11px 13px;font-size:.88rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice b{font-weight:650}

.seg{display:inline-flex;background:var(--surface2);border-radius:var(--r-in);padding:3px;gap:2px;position:relative;flex-wrap:wrap}
.seg label,.seg button{position:relative;margin:0}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span,.seg button{display:block;border:0;background:transparent;border-radius:var(--r-seg);padding:7px 14px;font-size:.85rem;font-weight:550;color:var(--muted);min-height:34px}
.seg input:checked+span,.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.seg.small span,.seg.small button{padding:4px 10px;font-size:.78rem;min-height:28px}
.seg.full{display:flex}.seg.full>*{flex:1}.seg.full button{text-align:center;padding-inline:6px}
.seg.full label span{text-align:center;padding-inline:6px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.idle{background:var(--idle-bg);color:var(--idle)}
.cur{font-family:var(--font-num);font-size:.68rem;font-weight:600;border-radius:6px;padding:1px 6px;letter-spacing:.03em;white-space:nowrap}
.cur.Bs{background:var(--bs-bg);color:var(--bs)}
.cur.USDT{background:var(--usdt-bg);color:var(--usdt)}
.cur.USD{background:var(--usd-bg);color:var(--usd)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.who{display:inline-flex;align-items:center;gap:5px}

.cat-row{display:flex;flex-direction:column;gap:5px;padding-block:8px}
.cat-row+.cat-row{border-top:1px solid var(--line)}
.cat-top{display:flex;align-items:center;gap:8px;min-width:0}
.cat-top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-top .num{font-size:.9rem}
.cat-top .pc{font-size:.76rem;color:var(--muted);width:3.2em;text-align:right}
.cat-eq{font-family:var(--font-num);font-size:.74rem;color:var(--muted);padding-left:18px}
.track{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.fill{height:100%;border-radius:3px}

/* gráfico por día */
.readout{font-size:.84rem;color:var(--muted);min-height:1.4em;margin-bottom:6px}
.readout b{color:var(--ink);font-weight:550}
.dchart{display:grid;grid-template-columns:repeat(var(--nd),minmax(0,1fr));gap:2px;height:120px;align-items:end;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat}
.dbar{height:100%;display:flex;align-items:flex-end;border:0;background:none;padding:0;min-width:0}
.dbar i{display:block;width:100%;height:var(--h);min-height:2px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85}
.dbar.zero i{background:var(--line);opacity:1;height:2px}
.dbar.today i{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.dbar.sel i{background:var(--ink);opacity:1}
.dlab{display:grid;grid-template-columns:repeat(var(--nd),minmax(0,1fr));gap:2px;margin-top:4px}
.dlab span{font-size:.66rem;color:var(--muted);text-align:center;font-family:var(--font-num);white-space:nowrap;overflow:visible}
.dmax{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-family:var(--font-num);margin-bottom:4px}
.donut{display:block;width:min(220px,70%);height:auto;margin:4px auto 10px}
.ch-big{fill:var(--ink);font-family:var(--font-num);font-size:15px;font-weight:500}
.ch-sm{fill:var(--muted);font-family:var(--font-num);font-size:7.5px}
.ch-li{display:flex;align-items:center;gap:8px;padding-block:5px;min-width:0}
.ch-li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-li .num{font-size:.86rem}
.ch-li .pc{font-size:.76rem;color:var(--muted);width:3.2em;text-align:right}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-btn);border:1px solid transparent;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.95rem}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad-bg)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.85rem}
.btn:disabled{opacity:.5}
.btn.block{width:100%}

.list{padding:0}
.list .row{display:flex;align-items:center;gap:12px;padding:var(--rpy) var(--rpx);width:100%;text-align:left;background:transparent;border:0;color:inherit;min-width:0}
.list .row+.row{border-top:1px solid var(--line)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t1{font-weight:560;overflow-wrap:anywhere}
.row .t2{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px}
.row .t3{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;max-width:46%}
.row .amt .num{font-size:.95rem;font-weight:500;overflow-wrap:anywhere}
.row .amt .eq{font-family:var(--font-num);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px 4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.82rem;font-weight:550;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{color:var(--muted);font-weight:500;font-size:.72rem}
.chip.on small{color:inherit;opacity:.75}
.total-line{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.total-line .num{font-size:1.25rem;font-weight:500}
.total-line .tl-r{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.total-line .tl-r .eq{font-family:var(--font-num);font-size:.72rem;color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.sec-pad{padding:var(--cpy) var(--cpx);margin:0}
.sub-h{font-size:.78rem;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 0 6px}
.loading{padding:30px 0;color:var(--muted);text-align:center}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:var(--spy)}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.set-row .sub{display:block;font-size:.78rem;color:var(--muted)}
.example{font-family:var(--font-num);font-size:.84rem;color:var(--muted);margin-top:8px}

.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.fld>span em{font-style:normal;font-weight:400}
#r-tter .hint{margin:6px 0 12px}
.fld-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld.grow{flex:1;min-width:8em}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-in);padding:11px 12px;font-size:max(16px,1rem);color:var(--ink)}
input[type=date]{min-height:46px}
textarea{resize:vertical;min-height:70px}
.err{color:var(--bad);font-size:.85rem}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
details.own{border:1px dashed var(--line);border-radius:var(--r-in);padding:9px 12px}
details.own summary{cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted)}
details.own summary em{font-style:normal;font-weight:400}
details.own .fld,details.own .fld-row{margin-top:10px}
.check{display:flex;align-items:center;gap:10px;font-size:.9rem}
.check input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.cs-prev{background:var(--accent-tint);color:var(--ink);border-radius:var(--r-in);padding:10px 12px;font-size:.86rem;min-height:2.6em}
.cs-prev .num{font-weight:500}
.cs-prev .warnx{color:var(--bad);font-weight:550}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:550;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(16px,calc((100vw - 560px) / 2 + 16px));bottom:calc(74px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab:disabled{opacity:.45}

.overlay{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .2s ease-out}
.sheet form,.sheet .col{display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:1.15rem}
.sticky-act{position:sticky;bottom:calc(-1 * (20px + env(safe-area-inset-bottom,0px)));z-index:3;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(138px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none!important}}

/* lista de acciones del + */
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;color:var(--ink)}
.choice .ico-c{width:40px;height:40px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;flex:none}
.choice b{display:block;font-weight:600}
.choice small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3;margin-top:1px}
.opsw{margin-bottom:2px}
@media (hover:hover){.choice:hover{border-color:var(--accent)}}
/* personalización */
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.opt-list{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--ink)}
.opt b{font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.opt small{color:var(--muted);font-size:.78rem;line-height:1.3}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-tint)}
.sw-grid{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw-btn{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .18);padding:0;flex:none}
.sw-btn.on{border-color:var(--bg);box-shadow:0 0 0 2px var(--ink)}
input[type=color]{width:46px;height:36px;padding:2px;border:1px solid var(--line);border-radius:var(--r-in);background:var(--surface);flex:none}
.tone-prev{display:flex;height:16px;border-radius:5px;overflow:hidden;border:1px solid rgb(0 0 0 / .15);margin-bottom:6px}
.tone-prev i{flex:1}
.blq{display:flex;align-items:center;gap:8px;padding-block:8px}
.blq+.blq{border-top:1px solid var(--line)}
.blq .nm{flex:1;min-width:0}
.ico-b{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0;flex:none}
.ico-b:disabled{opacity:.3}
.lbl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.welcome{background:var(--accent-tint);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.welcome h2{font-size:1.05rem}
.font-opt .smp{font-size:1.05rem;line-height:1.25}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1 1 140px;width:auto}
.addrow select{flex:0 0 auto;width:auto}
.catname{display:flex;align-items:center;gap:10px;min-width:0}
.catname .dot{width:12px;height:12px}


/* operaciones */
.hero-top{flex-wrap:wrap}
.hero-top .seg{flex-wrap:nowrap}
.hero-top .seg.small button{padding:4px 9px}
.hero-top .lbl{min-width:0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.mini{width:30px;height:30px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:var(--surface2);display:inline-block;vertical-align:middle}
.minis{display:inline-flex;gap:4px;align-items:center}
.pill.stage,.pill.cob{border:0;cursor:pointer;font-family:inherit}
.hit-row{position:relative}
.hit-row .hit{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;padding:0;border-radius:inherit;cursor:pointer}
.hit-row .main,.hit-row .amt{position:relative;pointer-events:none}
.hit-row .pill.stage,.hit-row .pill.cob{position:relative;z-index:1;pointer-events:auto;min-height:26px}
.toast-act{background:none;border:0;padding:0 0 0 10px;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.slot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slotlist{display:flex;flex-direction:column;gap:10px}
.thumb{width:84px;height:84px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface2);flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo{position:relative;overflow:hidden;cursor:pointer;min-height:44px;flex:1 1 160px}
.photo input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.viewer{position:fixed;inset:0;z-index:70;background:rgb(0 0 0 / .92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.viewer img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:8px;background:#fff}
.viewer .actions{width:min(420px,100%)}
.viewer a.btn{text-decoration:none}
.prev-box{background:var(--accent-tint);border-radius:var(--r-in);padding:11px 13px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.prev-box .l{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.prev-box .l span:first-child{color:var(--muted)}
.prev-box .l.big2 span:last-child{font-size:1.05rem;font-weight:600}
.prev-box .warnx{color:var(--bad);font-weight:550}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:10px}
.kv>div{background:var(--surface);padding:9px 12px;min-width:0}
.kv .lbl{display:block;font-size:.72rem;color:var(--muted);font-weight:550}
.kv .num{display:block;font-size:.92rem;margin-top:1px;overflow-wrap:anywhere}
.step-n{width:22px;height:22px;border-radius:50%;background:var(--accent-tint);color:var(--accent);font-size:.75rem;font-weight:700;display:inline-grid;place-items:center;flex:none}
ol.steps{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.86rem;color:var(--muted)}
ol.steps li{display:flex;gap:10px;align-items:flex-start}
ol.steps b{color:var(--ink);font-weight:600}
.copybox{font-family:var(--font-num);font-size:.82rem}
.fchip{display:inline-flex;align-items:center;gap:6px}
@media (hover:hover){
  .list .row:hover{background:var(--surface2)}
  .btn:hover{filter:brightness(1.07)}
  .btn.line:hover,.btn.ghost:hover{background:var(--surface2);filter:none}
  .chip:hover{border-color:var(--muted)}
  .tab:hover{color:var(--ink)}
  .icon:hover{background:var(--surface2)}
  .dbar:hover i{opacity:1}
}
@media (min-width:700px){
  .app{max-width:720px}
  .overlay{align-items:center;padding:16px}
  .sheet{max-width:600px;max-height:88vh;border-radius:var(--r-sheet);animation:pop .16s ease-out}
  .toast{bottom:32px}
  .fab{bottom:32px}
}
@media (min-width:1000px){
  body{font-size:.96875rem}
  .app{max-width:none;margin:0 0 0 232px;padding:0 clamp(28px,4vw,64px) 90px}
  .app>*{max-width:1120px;margin-inline:auto}
  .top{padding-block:18px 14px}
  .tabs{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .tabs::before{content:var(--app-name);display:block;padding:26px 22px 14px;font-weight:700;font-size:1.1rem;letter-spacing:-.01em}
  .tabs-in{max-width:none;margin:0;display:flex;flex-direction:column;gap:2px;padding:6px 12px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:11px 14px;border-radius:10px}
  .tab[aria-current="page"]{background:var(--accent-tint);color:var(--accent)}
  .fab{right:40px;bottom:36px;width:auto;height:52px;border-radius:26px;padding:0 22px 0 16px;gap:8px;display:flex;align-items:center}
  .fab::after{content:"Agregar";font-size:.95rem;font-weight:600}
  .toast{left:calc(50% + 116px)}
  #view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #view>*{grid-column:1/-1}
  #view>.half{grid-column:auto}
  .stats{grid-template-columns:repeat(var(--dc,4),minmax(0,1fr))}
  .stat:last-child{grid-column:span var(--sp-d,1)}
  .chips{margin-inline:0;padding-inline:0;flex-wrap:wrap;overflow:visible}
  .sheet{max-width:640px}
}

/* bloqueo de la app */
.applock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));overflow:auto}
.applock[hidden]{display:none}
.lock-in{width:min(340px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.lock-ico{width:56px;height:56px;border-radius:50%;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;margin:0 auto 4px}
.lock-ico svg{width:26px;height:26px}
.lock-in h1{font-size:1.3rem;font-weight:650;margin:0}
.lock-in input{text-align:center;font-size:1.5rem;letter-spacing:.4em;font-variant-numeric:tabular-nums}
.lock-wipe{border:1px solid var(--bad-bg);border-radius:var(--r-md);padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px}
.lock-wipe[hidden]{display:none}

.amb{color:var(--warn);font-size:.82rem;font-weight:550}
input.amb-in{border-color:var(--warn)}
#sheet:focus,#sheet:focus-visible{outline:none}

.tchart{width:100%;height:auto;display:block}
.tgrid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.tline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tline2{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 3;stroke-linejoin:round;stroke-linecap:round}
.tdot{fill:var(--accent)}
.tdot.last{stroke:var(--bg);stroke-width:1.5}
.ttxt{font-size:9px;fill:var(--muted);font-family:var(--font-num)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px}
.lgd{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted)}
.lgd i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent)}
.lgd i.d{border-top:2px dashed var(--muted)}

</button>

  <button class="tab" data-a="tab" data-t="ops"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg><span class="tl" data-l="t_ops">Operaciones</span></button>
  <button class="tab" data-a="tab" data-t="det"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span class="tl" data-l="t_det">Detalle</span></button>
  <button class="tab" data-a="tab" data-t="ajustes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg><span class="tl" data-l="t_ajustes">Ajustes</span></button>
</div></nav>
<div class="applock" id="lock" hidden role="dialog" aria-modal="true" aria-labelledby="lk-t">
  <form class="lock-in" id="lk-form" autocomplete="off">
    <div class="lock-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></div>
    <h1 id="lk-t">Cuentas P2P</h1>
    <p class="hint" id="lk-sub">Escribe tu PIN para entrar</p>
    <input id="lk-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="PIN">
    <p class="err" id="lk-err" role="alert" hidden></p>
    <button class="btn block" type="submit" id="lk-go">Entrar</button>
    <button class="btn line block" type="button" id="lk-bio" hidden>Usar huella o rostro</button>
    <button class="btn ghost sm" type="button" id="lk-forgot">Olvidé mi PIN</button>
    <div class="lock-wipe" id="lk-wipe" hidden>
      <p class="hint" style="color:var(--ink)">Si olvidaste el PIN, la única forma de entrar es <b>borrar los datos guardados en este dispositivo</b> y empezar de nuevo. Lo que tengas en la nube o en una copia de seguridad no se toca y podrás recuperarlo después.</p>
      <button class="btn danger block" type="button" id="lk-wipe-go">Borrar datos de este dispositivo</button>
    </div>
  </form>
</div>
<div class="overlay" id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="viewer" id="viewer" hidden><img id="v-img" alt="Comprobante"><div class="actions"><a class="btn" id="v-dl" download="comprobante.jpg">Descargar</a><button class="btn ghost" data-a="v-close">Cerrar</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

function calc(o){

  if(isTasaOp(o)){
    var tt=Number(o.terTasa),bsp=Number(o.bs)||0,g6=tasaGan(o);
    var tk={rec:rec,bs:bsp,env:env||rec,cam:0,mon:o.pagoMon,saldo:0,comprar:0,terCom:0,bruto:rec,tasa:true,terBs:tasaBs(o),gbsT:g6,pend:!o.terPago,perd:0};
    if(tasaUsdt()){ /* lo que le pagas a la persona se valora a la tasa del tercero: la ganancia en Bs pasa a USDT en el momento del pago */
      var cu=bsp/tt,gu=rec-cu,bq=CFG.mon.base==='recibido'?rec:cu;
      return Object.assign(tk,{tasaU:true,costo:cu,gan:gu,gan0:gu,pct:bq>0?gu/bq*100:null,gbs:g6,conv:0});
    }
    return Object.assign(tk,{costo:0,gan:0,gan0:0,pct:null,gbs:r6(g6-(o.terPago?convBy(o.id):0)),conv:o.terPago?convBy(o.id):0});
  }

    bs=Number(o.bs)||0; var tc=Number(o.tcambio); sal=Math.min(Math.max(Number(o.bsSaldo)||0,0),bs); cam=(bs-sal)>0?camOf(o):0;
    var fb=sal>0?Math.min(freeUsedBy(o.id),sal):0; /* Bs de ganancia por tasa que no habías convertido: al usarlos cambias menos */
    costo=tc>0?(bs-fb)/tc+cam:null; if(costo==null) cam=0;

  var base=CFG.mon.base==='recibido'?rec:costo,pct=(gan==null||!(base>0))?null:gan/base*100;
  return {rec:rec,costo:costo,gan:gan,gan0:gan0,perd:perd,pct:pct,bs:bs,env:env,cam:cam,mon:o.pagoMon,saldo:sal,comprar:bs-sal,terCom:terCom,bruto:bruto};
}

    if(exceptId&&e.k!=='sal'&&e.id===exceptId) return;
    var L=lots[e.mon]||(lots[e.mon]=[]);
    if(e.d>0) L.push({q:e.d,free:e.k==='opg'&&!tasaUsdt(),id:e.k==='opg'?e.id:''});
    else if(e.d<0){

      while(need>1e-9&&L.length){var l=L[0],u=Math.min(l.q,need);if(l.free){fr+=u;if(e.k==='op'&&l.id) conv[l.id]=r6((conv[l.id]||0)+u)}l.q-=u;need-=u;if(l.q<=1e-9) L.shift()}

/* ---------- saldo por cuenta (estimado) ---------- */
/* Parte del saldo real que anotas (con fecha y hora) y suma o resta lo que registraste después:
   retiros y depósitos (con su comisión), lo recibido en cada plataforma, lo que pagas desde la cuenta que elijas y los cobros de terceros. */
function pagoAcc(mon){var x=CFG.mon.pago&&CFG.mon.pago[mon];return x&&lugares().some(function(l){return l.id===x})?x:''}
function retMon(r){return r.mon||'USDT'}
function saldoLugar(id,mon){return memo('sl|'+id+'|'+mon,function(){
  var L=lugarById(id),an=(L.aj&&L.aj[mon])||null,s=an?an.v:0,pa=pagoAcc(mon)===id;
  var after=function(f,c){return !an||f>an.f||(f===an.f&&(c||0)>an.t)};
  liveRets().forEach(function(r){
    if(retMon(r)!==mon||!after(r.fecha,r.creado)) return;
    var m=Number(r.monto)||0; if(r.de===id) s-=m; if(r.a===id) s+=m-(Number(r.comision)||0);
  });
  liveGastos().forEach(function(r){if(r.de===id&&retMon(r)===mon&&after(r.fecha,r.creado)) s-=Number(r.monto)||0});
  liveOps().forEach(function(o){
    if(!after(o.fecha,o.creado)) return;
    if(mon==='USD'&&o.plat===id&&!o.ter) s+=Number(o.recibido)||0;
    if(!pa) return;
    if(!isLoc(o.pagoMon)){if(o.pagoMon===mon) s-=Number(o.envio)||0}
    else if(mon==='USDT'){var k=calc(o),tc=Number(o.tcambio);if(tc>0) s-=(k.comprar>0?k.comprar/tc:0)+k.cam}
  });
  if(pa&&mon==='USDT') liveSal().forEach(function(x){if(x.tipo==='cobro'&&after(x.fecha,x.creado)) s+=Number(x.usdt)||0});
  return r6(s);
})}
function cuentasRows(){return memo('cr',function(){
  var out=[],ops=liveOps(),rets=liveRets();

    var ms={},L=lugarById(l.id);

    rets.forEach(function(r){if(r.de===l.id||r.a===l.id) ms[retMon(r)]=1});
    liveGastos().forEach(function(r){if(r.de===l.id) ms[retMon(r)]=1});

/* ---------- tasa de cambio en el tiempo y pérdida por mantener moneda local ---------- */
/* una fila por día: tasa a la que cambias (tc) y a la que le pagas a la gente (tp), promediadas por monto */
function tasaSerie(mon){return memo('ts|'+mon,function(){
  var m={};
  liveOps().forEach(function(o){
    if(o.pagoMon!==mon||!o.fecha||!(Number(o.tcambio)>0)) return;
    var e=m[o.fecha]||(m[o.fecha]={f:o.fecha,tc:0,w:0,tp:0,wp:0}),w=Number(o.bs)>0?Number(o.bs):1;
    e.tc+=Number(o.tcambio)*w;e.w+=w;
    if(Number(o.tpago)>0){e.tp+=Number(o.tpago)*w;e.wp+=w}
  });
  return Object.keys(m).sort().map(function(f){var e=m[f];return {f:f,tc:e.tc/e.w,tp:e.wp>0?e.tp/e.wp:0}});
})}
function rateAt(ser,f){
  var lo=0,hi=ser.length-1,r=-1;
  while(lo<=hi){var mid=(lo+hi)>>1;if(ser[mid].f<=f){r=mid;lo=mid+1}else hi=mid-1}
  return ser[r<0?0:r].tc;
}
/* Los Bs que recibes se gastan en el orden en que llegaron (primero en entrar, primero en salir).
   Cada lote se compara en USDT: lo que valía cuando lo recibiste contra lo que vale cuando lo gastas, o contra lo que vale hoy si aún lo tienes. */
function fxPerdida(mon){return memo('fx|'+mon,function(){
  var ser=tasaSerie(mon); if(!ser.length) return null;
  var now=ser[ser.length-1].tc,lots=[],real=0,consumed=0;
  ledgerAll().forEach(function(e){
    if(e.mon!==mon) return;
    if(e.d>0){
      var r=(e.k==='sal'&&e.x.tipo==='cobro'&&Number(e.x.tasa)>0)?Number(e.x.tasa):(e.k==='opg'&&Number(e.o.terTasa)>0)?Number(e.o.terTasa):rateAt(ser,e.fecha);
      if(r>0) lots.push({bs:e.d,r:r});
    }else if(e.d<0){
      var need=-e.d,ru=rateAt(ser,e.fecha);
      while(need>1e-9&&lots.length){
        var l=lots[0],t=Math.min(l.bs,need);
        real+=t/ru-t/l.r;consumed+=t;l.bs-=t;need-=t;if(l.bs<=1e-9) lots.shift();
      }
    }
  });
  var held=0,valIn=0;lots.forEach(function(l){held+=l.bs;valIn+=l.bs/l.r});
  var valNow=held/now,unreal=valNow-valIn;
  return {mon:mon,now:now,held:held,valIn:valIn,valNow:valNow,unreal:unreal,real:real,consumed:consumed,total:real+unreal};
})}

async function pinHash(pin,saltB64,iter){
  var base=await crypto.subtle.importKey('raw',TE.encode(pin),'PBKDF2',false,['deriveBits']);

function navBack(){
  NAV.back++; clearTimeout(NAV.timer);
  NAV.timer=setTimeout(function(){NAV.back=0;navFlush()},900);
  try{history.back()}catch(e){NAV.back=0;navFlush()}
}
function wireNav(){
  try{history.replaceState({p2p:1,k:'tab',t:tab},'');NAV.tab=tab}catch(e){}
  window.addEventListener('popstate',function(e){
    if(NAV.back>0){NAV.back--;if(NAV.back===0) navFlush();return}
    if(lockedNow) return;
    var st=e.state;
    if(!$('#viewer').hidden){closeViewer(true);return}
    if(!overlay.hidden){closeSheet(true);return}
    if(st&&st.p2p&&st.k==='tab'&&TAB_IDS.indexOf(st.t)>-1&&st.t!==tab){tab=st.t;NAV.tab=tab;render();window.scrollTo(0,0)}
  });
}
var overlay=$('#overlay'), sheet=$('#sheet');
function openSheet(html,init){
  var was=!overlay.hidden;
  if(!was) NAV.opener=(document.activeElement&&document.activeElement!==document.body)?document.activeElement:null;
  sheet.innerHTML=html; overlay.hidden=false; document.body.classList.add('lock'); sheet.scrollTop=0;
  var h=sheet.querySelector('h2'); if(h){h.id='sheet-t';sheet.setAttribute('aria-labelledby','sheet-t')}
  syncInert();
  if(!NAV.sheet){NAV.sheet=true;navPush('sheet')}
  if(init) init(sheet);
  if(!sheet.contains(document.activeElement)){sheet.tabIndex=-1;try{sheet.focus({preventScroll:true})}catch(e){}}
}
function closeSheet(fromPop){
  var was=!overlay.hidden;
  overlay.hidden=true;sheet.innerHTML='';document.body.classList.remove('lock');
  if(NAV.sheet){NAV.sheet=false;if(fromPop!==true&&history.state&&history.state.k==='sheet') navBack()}
  syncInert();
  if(was&&NAV.opener&&NAV.opener.isConnected&&!lockedNow){try{NAV.opener.focus({preventScroll:true})}catch(e){}}
  NAV.opener=null;
}
overlay.addEventListener('mousedown',function(e){if(e.target===overlay) closeSheet()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!overlay.hidden) closeSheet()});
var toastT=null;
function toast(msg,act){
  var t=$('#toast');t.textContent=msg;
  if(act){var b=document.createElement('button');b.type='button';b.className='toast-act';b.textContent=act.label;b.addEventListener('click',function(){t.hidden=true;clearTimeout(toastT);act.fn()});t.appendChild(b)}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},act?6000:2800);
}
function showErr(msg){var e=sheet.querySelector('#err');if(e){e.textContent=msg;e.hidden=false}}
function confirmTap(el,label,fn){
  if(!el.dataset.sure){ el.dataset.sure='1'; var old=el.innerHTML; el.textContent=label; setTimeout(function(){if(el.isConnected){delete el.dataset.sure;el.innerHTML=old}},3200); return }
  fn();
}
function swatchBlock(sel){
  return '<div class="fld"><span>Color</span><div class="sw-grid" id="sw">'+COL_SW.map(function(c){return '<button type="button" class="sw-btn'+(c.toLowerCase()===sel.toLowerCase()?' on':'')+'" style="background:'+c+'" data-col="'+c+'" aria-label="Color '+c+'"></button>'}).join('')+'<input type="color" id="swc" value="'+esc(sel)+'" aria-label="Elegir otro color"></div></div>';
}
function bindSwatches(s,get,set){
  var box=s.querySelector('#sw'),pick=s.querySelector('#swc');
  function sync(){var c=get().toLowerCase();pick.value=c;$$('.sw-btn',box).forEach(function(b){b.classList.toggle('on',b.dataset.col.toLowerCase()===c)})}
  box.addEventListener('click',function(e){var b=e.target.closest('[data-col]');if(b){set(b.dataset.col);sync()}});
  pick.addEventListener('input',function(){set(pick.value);sync()});
}

function persSugs(text,limit){
  var t=text.trim().toLowerCase();
  return persList().filter(function(p){return !t||p.nombre.toLowerCase().indexOf(t)>-1}).map(function(p){return {p:p,u:persUsage(p.id)}}).sort(function(a,b){return b.u-a.u||a.p.nombre.localeCompare(b.p.nombre,'es')}).slice(0,limit||14).map(function(x){return x.p});
}

      var o9=opById(id); if(!o9) break; o9=clone(o9); o9.terPago=o9.terPago?0:1; putOp(o9);
      render(); toast(o9.terPago?terNom(o9.ter)+' ya pagó: tu saldo en '+cname(o9.pagoMon)+' subió':'Marcada como por cobrar'); break;
    }
    case 'cobro-op': var cbo=cobrosMap(true)[id]; if(cbo) sheetCobro(cbo.id); else sheetCobro(null,{op:id}); break;
    case 'sal': var sx=salById(id); if(sx) {if(sx.tipo==='cobro') sheetCobro(id); else sheetSaldo(id)} break;
    case 'new-sal': sheetSaldo(null,{tipo:v}); break;
    case 'go-saldo': tab='ops'; opsView='saldo'; prefSet('opsv','saldo'); busq=''; render(); window.scrollTo(0,0); break;
    case 'new-ter': sheetTercero(); break;
    case 'ter': sheetTercero(id); break;
    case 'new-mon': sheetMoneda(); break;
    case 'mon-edit': sheetMoneda(id); break;
    case 'new-cuenta': sheetCuenta(); break;
    case 'cuenta': sheetCuenta(id); break;
    case 'cuenta-up': if(mover(CFG.cuentas,id,-1)){saveCfg();render()} break;
    case 'cuenta-down': if(mover(CFG.cuentas,id,1)){saveCfg();render()} break;
    case 'op': sheetOp(id); break;
    case 'etapa-next':
      var o=opById(id); if(!o) break;
      var ei=etapaIdx(o.etapa); if(ei<0) ei=0;
      if(ei>=CFG.etapas.length-1){toast('Ya está en “'+CFG.etapas[ei].nombre+'”, el final del recorrido')}
      else{
        var prevE=o.etapa,c2=clone(o);c2.etapa=CFG.etapas[ei+1].id;putOp(c2,o.fecha);render();
        toast('Pasó a “'+CFG.etapas[ei+1].nombre+'”',{label:'Deshacer',fn:function(){var cu=opById(id);if(!cu) return;var c3=clone(cu);c3.etapa=prevE;putOp(c3,cu.fecha);render();toast('Volvió a “'+etapaById(prevE).nombre+'”')}});
      }
      break;
    case 'close': closeSheet(); break;
    case 'v-close': closeViewer(); break;
    case 'f-plat': filt.plat=b.dataset.c; render(); break;
    case 'f-etapa': filt.etapa=b.dataset.c; render(); break;
    case 'f-pers-x': filt.pers=''; render(); break;
    case 'go-f': filt={plat:'todas',etapa:'todas',pers:''}; busq=''; opsView='pagos'; if(b.dataset.k==='plat') filt.plat=id; else if(b.dataset.k==='pers') filt.pers=id; else filt.etapa=id; tab='ops'; render(); window.scrollTo(0,0); break;
    case 'det-v': detView=v; render(); break;
    case 'per-v': perMode=v; if(v==='custom'&&!perA){perA=curKey.slice(0,4)+'-01-01';perB=ymd(NOW)} render(); break;
    case 'go-mes': goMonth(v); detView='dia'; render(); window.scrollTo(0,0); break;
    case 'cu-open': sheetCuentas({l:b.dataset.l,m:b.dataset.m}); break;
    case 'tasa-rng': prefSet('tasarng',v); render(); break;
    case 'tasa-mon': prefSet('tasamon',v); render(); break;
    case 'grafpor': prefSet('grafpor',v); render(); break;
    case 'go-det': tab='det'; detView=v; render(); window.scrollTo(0,0); break;
    case 'dia': var rd=$('#dread'); if(rd){rd.innerHTML=b.dataset.t;$$('.dbar.sel').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel')} break;
    case 'welcome-no': saveSetup(); render(); break;
    case 'go-aj': if(b.dataset.setup) saveSetup(); tab='ajustes'; ajTab=v; render(); window.scrollTo(0,0); break;
    case 'go-sync': if(SYNC.on||syncCfg().gist){tab='ajustes';ajTab='sync';render();window.scrollTo(0,0)} break;
    case 'atab': ajTab=v; render(); break;
    /* plataformas, personas, etapas */
    case 'new-plat': sheetPlat(); break;
    case 'plat': sheetPlat(id); break;
    case 'plat-up': if(mover(CFG.plats,id,-1)){saveCfg();render()} break;
    case 'plat-down': if(mover(CFG.plats,id,1)){saveCfg();render()} break;
    case 'new-pers': sheetPers(); break;
    case 'pers': sheetPers(id); break;
    case 'new-etapa': sheetEtapa(); break;
    case 'etapa': sheetEtapa(id); break;
    case 'etapa-up': if(mover(CFG.etapas,id,-1)){saveCfg();render()} break;
    case 'etapa-down': if(mover(CFG.etapas,id,1)){saveCfg();render()} break;
    /* cálculo y formato */
    case 'calc-base': CFG.mon.base=v; saveCfg(); render(); break;
    case 'calc-tasa': CFG.mon.tasaGan=v==='bs'?'bs':'usdt'; saveCfg(); render(); break;
    case 'calc-defmon': CFG.mon.defMon=v; saveCfg(); render(); break;
    case 'calc-perdbase': CFG.mon.perdBase=v; saveCfg(); render(); break;
    case 'num-dec': CFG.mon.dec=Number(v); saveCfg(); render(); break;
    case 'num-sep': CFG.mon.sep=v; saveCfg(); render(); break;
    /* resumen */
    case 'vista': CFG.resumen.vista=v; if(v==='personal') personalDesde('personal'); saveCfg(); render(); break;
    case 'vista-custom': var cur=CFG.resumen.vista; CFG.resumen.vista='personal'; personalDesde(cur); saveCfg(); render(); break;
    case 'rs-graf': CFG.resumen.graf=v; saveCfg(); render(); break;
    case 'rs-stat':
      var ix=CFG.resumen.stats.indexOf(id);
      if(ix>-1){if(CFG.resumen.stats.length>1) CFG.resumen.stats.splice(ix,1)}
      else CFG.resumen.stats=STAT_IDS.filter(function(x){return x===id||CFG.resumen.stats.indexOf(x)>-1});
      saveCfg(); render(); break;
    case 'blq-up': ordenFix(); if(mover(CFG.resumen.orden,id,-1)){saveCfg();render()} break;
    case 'blq-down': ordenFix(); if(mover(CFG.resumen.orden,id,1)){saveCfg();render()} break;
    /* apariencia */
    case 'ui-tema': setUI('tema',v); break;
    case 'ui-acento': setUI('acento',v); break;
    case 'ui-tono': setUI('tono',v); break;
    case 'ui-fuente': setUI('fuente',v); break;
    case 'ui-num': setUI('num',v); break;
    case 'ui-tam': setUI('tam',Number(v)); break;
    case 'ui-dens': setUI('dens',v); break;
    case 'ui-esq': setUI('esq',v); break;
    case 'ui-reset': UI=defaultUI(); uiSave(); render(); toast('Apariencia restablecida'); break;
    case 'txt-reset': CFG.txt={}; saveCfg(); render(); toast('Textos restablecidos'); break;
    /* datos */
    case 'export-file': exportFile(false); break;
    case 'export-file-img': exportFile(true); break;
    case 'export-csv': exportCsv(); break;
    case 'export-csv-movs': exportCsvMovs(); break;
    case 'export-csv-saldo': exportCsvSaldo(); break;
    case 'cam-apply': confirmTap(b,'Toca otra vez para aplicar',camApply); break;
    case 'restore': confirmTap(b,'Toca otra vez para restaurar',restore); break;
    /* seguridad */
    case 'lk-set': lkActivate(); break;
    case 'lk-now': showLock(); break;
    case 'lk-auto': LK.auto=Number(v);lkSave();render(); break;
    case 'lk-change': lkChange(); break;
    case 'lk-off': confirmTap(b,'Toca otra vez para quitar',lkRemove); break;
    case 'lk-bio-on': bioEnroll().then(function(){render();toast('Huella o rostro activado')}).catch(function(){toast('No se pudo activar. Revisa que el teléfono tenga huella o rostro configurado.')}); break;
    case 'lk-bio-off': LK.cred='';lkSave();render();toast('Huella o rostro desactivado'); break;
    /* nube */
    case 'sync-connect': syncConnect(); break;
    case 'sync-pass-go': syncPassGo(); break;
    case 'sync-now': syncNow(true); break;
    case 'sync-off': confirmTap(b,'Toca otra vez para desconectar',syncOff); break;
    case 'sync-rekey': confirmTap(b,'Toca otra vez para confirmar',syncRekey); break;
  }
});
document.addEventListener('keydown',function(e){
  if(lockedNow) return;
  if(e.key==='Escape'){ if(!$('#viewer').hidden) closeViewer(); else if(!overlay.hidden) closeSheet(); return }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}
});
document.addEventListener('mouseover',function(ev){
  var b=ev.target.closest&&ev.target.closest('.dbar'); if(!b) return;
  var rd=$('#dread'); if(rd&&b.dataset.t) rd.innerHTML=b.dataset.t;
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.a==='blq-vis'){ordenFix();var r=CFG.resumen,i=r.ocultos.indexOf(el.dataset.id);if(el.checked&&i>-1) r.ocultos.splice(i,1);else if(!el.checked&&i<0) r.ocultos.push(el.dataset.id);saveCfg();render()}
  else if(el.id==='ui-color'){UI.acento=el.value.toUpperCase();uiSave();render()}
  else if(el.dataset&&(el.dataset.a==='per-a'||el.dataset.a==='per-b')){if(el.dataset.a==='per-a') perA=el.value; else perB=el.value; render()}
  else if(el.dataset&&el.dataset.set){render()}
});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.id==='q'){busq=el.value;renderLista();return}
  if(el.id==='ui-color'){UI.acento=el.value.toUpperCase();uiSave();applyUI();return}
  var s=el.dataset&&el.dataset.set; if(!s) return;
  if(s==='txt'){var k=el.dataset.k,t=el.value.trim().slice(0,40); if(t&&t!==DEF_TXT[k]) CFG.txt[k]=t; else delete CFG.txt[k]; saveCfg(); applyUI()}
  else if(s==='comcam'){
    var rw=el.value.trim(),cn=rw?parseNum(rw):0,badc=rw&&!(cn>=0&&cn<=1000),erc=$('#cam-err'); if(erc) erc.hidden=!badc;
    if(!badc){CFG.mon.comCam=cn>0?cn:0; saveCfg(); [['#cam-ex',camExample],['#base-ex',baseExample],['#perd-ex',perdExample]].forEach(function(z){var e=$(z[0]); if(e) e.textContent=z[1]()})}
  }
  else if(s==='perd'){
    var raw=el.value.trim(),pn=raw?parseNum(raw):0,bad=raw&&!(pn>=0&&pn<=50),er=$('#perd-err'); if(er) er.hidden=!bad;
    if(!bad){CFG.mon.perd=pn>0?pn:0; saveCfg(); var ex3=$('#perd-ex'); if(ex3) ex3.textContent=perdExample()}
  }
  else if(s.indexOf('mon-')===0){var f=s.slice(4),t2=el.value.trim().slice(0,10); CFG.mon[f]=t2||defaultConfig().mon[f]; saveCfg()}
});

/* ---------- avisos de números ambiguos ---------- */
function ambNote(el){
  var lab=el.closest('label'),a=numAmbig(el.value),n=lab&&lab.querySelector('.amb');
  if(!a){if(n) n.remove();el.classList.remove('amb-in');return}
  if(!lab) return;
  if(!n){n=document.createElement('small');n.className='amb';n.setAttribute('role','status');lab.appendChild(n)}
  n.textContent='Se lee como '+a.read+'. Si querías '+String(a.alt).replace('.',a.dec)+', escribe el decimal con '+a.decName+'.';
}
/* al guardar: si hay un número ambiguo, la primera vez no guarda y lo marca; si se vuelve a guardar sin cambiarlo, se da por confirmado */
function ambGuard(root){
  var bad=[];
  $$('input[inputmode=decimal]',root).forEach(function(el){
    if(el.closest('[hidden]')) return;
    var a=numAmbig(el.value); if(a&&el.dataset.ambOk!==el.value) bad.push(el);
  });
  if(!bad.length) return false;
  bad.forEach(function(el){el.dataset.ambOk=el.value;el.classList.add('amb-in');ambNote(el)});
  bad[0].focus();
  var a0=numAmbig(bad[0].value);
  toast('Revisa «'+bad[0].value+'»: se lee como '+a0.read+'. Si es correcto, guarda otra vez.');
  return true;
}
document.addEventListener('submit',function(e){var f=e.target;if(f&&f.id==='f'&&ambGuard(f)){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('#b-more');if(!b) return;var f=b.closest('form');if(f&&ambGuard(f)){e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('input',function(e){var el=e.target;if(el&&el.matches&&el.matches('input[inputmode=decimal]')) ambNote(el)});

/* ---------- arranque ---------- */
lkLoad(); lkWire(); if(LK.on) showLock();
uiLoad(); applyUI(); render();
(async function(){
  await idbOpen(); await loadAll(); await loadSyncCfg();
  ready=true; applyUI(); render();
  wireTabs(); wireNav(); initSync();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready}).then(function(reg){if(reg&&reg.active) reg.active.postMessage({cache:location.origin+location.pathname})}).catch(function(){})}catch(e){}}
})();
window.addEventListener('pagehide',function(){if(wiping) return;flushPersist();msSave()});
document.addEventListener('visibilitychange',function(){if(!document.hidden) refreshNow(true)});
window.addEventListener('focus',function(){refreshNow(true)});
window.addEventListener('pageshow',function(){refreshNow(true)});
setInterval(function(){if(!document.hidden) refreshNow(true)},60000);
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist()}catch(e){}
/* solo para las pruebas automáticas: exponen el interior de la app cuando la página define window.__P2P_TEST antes de cargar */
if(window.__P2P_TEST){window.__P2P={ev:function(s){return eval(s)}}}
})();
